<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Stylized Monogram N & Aptitude Icon -->
  <path d="M16 46 V18 L32 38 V18" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Math / Logic Symbol: Sigma / Delta Accent -->
  <path d="M38 20 H50 L42 32 L50 44 H38" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="42" cy="32" r="2.5" fill="#ffffff" />
</svg>
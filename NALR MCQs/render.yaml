services:
  # Option 1: Static Site (Fastest, zero-config, 100% free)
  - type: web
    name: nalr-mcqs-revision
    env: static
    plan: free
    buildCommand: ""
    publishPath: .
    autoDeploy: true

  # Option 2: Docker Web Service
  - type: web
    name: nalr-mcqs-docker
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
